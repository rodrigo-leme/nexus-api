<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="glow1" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00C8FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0A1628" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#FF6B2B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0A1628" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00C8FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00C8FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00C8FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="#0A1628"/>
  <rect width="1920" height="1080" fill="url(#glow1)"/>
  <rect width="1920" height="1080" fill="url(#glow2)"/>

  <!-- Grid lines -->
  <g stroke="url(#line-grad)" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="270" x2="1920" y2="270"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="810" x2="1920" y2="810"/>
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
  </g>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.4">
    <circle cx="150" cy="120" r="1.5"/>
    <circle cx="320" cy="80" r="1"/>
    <circle cx="520" cy="200" r="1.5"/>
    <circle cx="780" cy="90" r="1"/>
    <circle cx="1100" cy="150" r="2"/>
    <circle cx="1400" cy="60" r="1"/>
    <circle cx="1650" cy="180" r="1.5"/>
    <circle cx="1800" cy="100" r="1"/>
    <circle cx="250" cy="350" r="1"/>
    <circle cx="600" cy="420" r="1.5"/>
    <circle cx="900" cy="300" r="1"/>
    <circle cx="1300" cy="380" r="1.5"/>
    <circle cx="1700" cy="320" r="1"/>
    <circle cx="100" cy="700" r="1"/>
    <circle cx="400" cy="800" r="1.5"/>
    <circle cx="700" cy="750" r="1"/>
    <circle cx="1050" cy="850" r="1.5"/>
    <circle cx="1500" cy="700" r="1"/>
    <circle cx="1850" cy="900" r="1.5"/>
  </g>

  <!-- Diamond logo -->
  <g transform="translate(960,420)">
    <polygon points="0,-80 60,0 0,80 -60,0" fill="none" stroke="#00C8FF" stroke-width="2" opacity="0.6"/>
    <polygon points="0,-50 38,0 0,50 -38,0" fill="none" stroke="#00C8FF" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- SPACE CODE text -->
  <text x="960" y="560" text-anchor="middle" font-family="Inter, Arial, sans-serif"
        font-size="72" font-weight="900" fill="#FFFFFF" letter-spacing="6">SPACE CODE</text>

  <!-- LTDA subtitle -->
  <text x="960" y="600" text-anchor="middle" font-family="Inter, Arial, sans-serif"
        font-size="20" font-weight="300" fill="#00C8FF" letter-spacing="8">LTDA</text>

  <!-- Tagline -->
  <text x="960" y="660" text-anchor="middle" font-family="Inter, Arial, sans-serif"
        font-size="16" font-weight="400" fill="#8892B0" letter-spacing="2">SOFTWARE PARA AMBIENTES EXTREMOS</text>

  <!-- Bottom accent line -->
  <rect x="860" y="690" width="200" height="2" rx="1" fill="#FF6B2B" opacity="0.6"/>

  <!-- NEXUS badge -->
  <text x="960" y="740" text-anchor="middle" font-family="Inter, Arial, sans-serif"
        font-size="14" font-weight="600" fill="#FF6B2B" letter-spacing="4" opacity="0.5">POWERED BY NEXUS</text>
</svg>
